<div class="container "><div class="container-in padding-top-large padding-bottom-large"><div class="box l-5 tl-12 ml-12 align-left malign-left fadeInLeft"><div class="box l-12 tl-12 ml-12 align-left talign-left malign-left fadeInUp cabec-tela"><span class="rotulo-menu">DG Processos</span><h1 class="titulo-tela">Limpeza antes do arquivamento</h1></div><p>Antes de arquivar o projeto, organize a pasta “_DG” para permitir conferências e futuras alterações. A versão editável e os arquivos vinculados precisam continuar disponíveis.</p></div><div class="box l-6 tl-12 ml-12 offset-1 align-left malign-left fadeInRight"><h3 class="subtitulo-bloco">Conformidade da pasta _DG</h3><ul class="checklist-ast"><li><label for="chk-tela_41-0"><input type="checkbox" id="chk-tela_41-0"><span class="caixa" aria-hidden="true"></span><span class="texto">Conferir qual é a última versão do arquivo editável.</span></label></li><li><label for="chk-tela_41-1"><input type="checkbox" id="chk-tela_41-1"><span class="caixa" aria-hidden="true"></span><span class="texto">Verificar os arquivos vinculados e se o projeto abre corretamente.</span></label></li><li><label for="chk-tela_41-2"><input type="checkbox" id="chk-tela_41-2"><span class="caixa" aria-hidden="true"></span><span class="texto">Remover duplicados dispensáveis e pastas de backup após conferir o que precisa ser preservado.</span></label></li><li><label for="chk-tela_41-3"><input type="checkbox" id="chk-tela_41-3"><span class="caixa" aria-hidden="true"></span><span class="texto">Remover o ZIP temporário de fontes enviado ao cliente, mantendo os arquivos fontes necessários ao projeto.</span></label></li><li><label for="chk-tela_41-4"><input type="checkbox" id="chk-tela_41-4"><span class="caixa" aria-hidden="true"></span><span class="texto">Conferir a saída final: “_PUB” para a estrutura publicada de OP/Storyline; “_render” para vídeos e podcasts; ou a raiz da pasta da mídia, conforme o padrão de PDF, e-book, cartilha, infográfico e folheto.</span></label></li><li><label for="chk-tela_41-5"><input type="checkbox" id="chk-tela_41-5"><span class="caixa" aria-hidden="true"></span><span class="texto">Quando não houver estrutura HTML no projeto, o cartão orienta remover a pasta “_PUB” que não se aplica ao material. Antes, conferir se ela não contém a única cópia de uma entrega necessária.</span></label></li></ul></div></div></div>
